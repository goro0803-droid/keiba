  if (t2.組番) s += '<span class="lb hit">的中率重視</span>2車単 <b>'+esc(t2.組番)+'</b>'+res(t2)+'・ワイド <b>'+esc(tw.組番)+'</b>'+res(tw)+(r.的中相手同ライン?'':' <small>(同ライン無し→勝点2位)</small>')
    + (t3.組番 ? '・3連単 <b>'+esc(t3.組番)+'</b>'+res(t3) : '');
  s += (s?'<br>':'') + '<span class="lb roi">回収率重視</span>' + (rw.組番 ? 'ワイド <b>'+esc(rw.組番)+'</b>'+res(rw) : '<span class="skip">'+esc(rw.見送り||'見送り')+'</span>');
  return '<div class="info buy">'+s+'</div>';
}
function render(){
  const day = D.days.find(x => x.date === curDay) || D.days[1];
  // 日付タブ
  dtabs.innerHTML = '';
  D.days.forEach(x => {
    const b = document.createElement('button');
    b.innerHTML = esc(x.label) + '<b>' + esc(x.disp) + '</b>';
    if (x === day) b.className = 'on';
    b.onclick = () => { curDay = x.date; render(); };
    dtabs.appendChild(b);
  });
  // 競走場タブ
  vtabs.innerHTML = ''; rtabs.innerHTML = ''; main.innerHTML = '';
  if (!day.venues.length) { main.innerHTML = '<div class="empty">この日は対象のレースがありません</div>'; return; }
  let v = day.venues.find(x => x.name === curV) || day.venues[0];
  day.venues.forEach(x => {
    const b = document.createElement('button');
    const nx = x.races.find(r => isOpen(day, r));
    b.innerHTML = '<b>'+esc(x.name)+(x.グレード?' '+esc(x.グレード):'')+'</b>' + (nx ? '次 '+nx.rno+'R '+hhmm(nx.発走) : '終了');
    if (x === v) b.className = 'on';
    b.onclick = () => { curV = x.name; try { localStorage.setItem('venue', curV); } catch(e) {} render(); };
    vtabs.appendChild(b);
  });
  document.querySelectorAll('.seg button').forEach(b => b.className = b.dataset.s === sort ? 'on' : '');
  // レース番号タブ（食い違いのレースは赤枠）
  const nextR = v.races.find(r => isOpen(day, r));
  v.races.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r.rno + 'R';
    b.className = (!isOpen(day, r) ? 'past' : (r === nextR ? 'now' : ''));
    b.onclick = () => {
      openState[day.date + v.name + r.rno] = true; render();
      const el = document.getElementById('r' + r.rno);
      if (el) { const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.topbar').offsetHeight; window.scrollTo({top: y, behavior: 'smooth'}); }
    };
    rtabs.appendChild(b);
  });
  // レース本体
  v.races.forEach(r => {
    const sec = document.createElement('section');
    sec.className = 'race'; sec.id = 'r' + r.rno;
    const top = r.馬[0];
    const open = isOpen(day, r);
    const status = r.確定 ? '確定' : (open ? (day.date > todayYMD() ? '前日' : '発売中') : '締切済');
    const winner = r.確定 ? r.馬.find(h => h.着順 === '1') : null;
    const pick = r.確定 && winner
      ? '1着 ' + winner.馬番 + ' ' + esc(winner.馬名) + '<br>' + (top ? '予想1位 ' + top.馬番 + '→' + (top.着順 || '-') + '着' : '')
      : (top ? top.馬番 + ' ' + esc(top.馬名) + '<br>勝' + fmt(top.勝点,0) + '点' + (top.人気 ? '・'+top.人気+'人気' : '') : '');
    const key = day.date + v.name + r.rno;
    const isOpened = opened(key, r === nextR);
    const wx = [r.天候 ? '天候:'+esc(r.天候) : '', r.風速!=='' && r.風速!==undefined ? '風'+r.風速+'m' : ''].filter(x => x).join(' ');
    sec.innerHTML = '<div class="rh"><span class="no">'+r.rno+'R</span><span class="ttl"><span class="name">'+esc(r.レース名)+'</span><span class="st'+(open?' open':'')+'">'+status+'</span>'
      + '<div class="info">'+hhmm(r.発走)+'発走（締切'+hhmm(r.締切)+'）／ '+r.頭数+'車'+(wx?' ／ '+wx:'')+(r.確定&&r.決まり手?' ／ '+esc(r.決まり手):'')+'</div>'
      + (r.並び ? '<div class="info line">並び '+esc(r.並び)+(r.分戦?'（'+esc(r.分戦)+'）':'')+(r.並び元==='推定'?'<small class="est">推定</small>':'<small class="ofc">公式</small>')+'</div>' : '')+buyLine(r)+'</span>'
      + '<span class="pick">'+pick+'</span><span class="tri">'+(isOpened?'▲':'▼')+'</span></div>';
    sec.querySelector('.rh').onclick = () => { openState[key] = !isOpened; render(); };
    if (isOpened) {
      const rows = r.馬.slice();
      if (sort === 'no') rows.sort((a,b) => a.馬番 - b.馬番);
      else if (sort === 'res' && r.確定) rows.sort((a,b) => rankNum(a.着順) - rankNum(b.着順));
      else if (sort === 'gap') rows.sort((a,b) => (b.評価差 ?? -999) - (a.評価差 ?? -999));
      if (r['3連単上位'] && r['3連単上位'].length) {
        const act = r.確定 ? ['1','2','3'].map(k => (r.馬.find(h => h.着順 === k) || {}).馬番).join('-') : '';
        const tb = document.createElement('div');
        tb.className = 'tri3';
        tb.innerHTML = '<div class="h"><b>3連単の確率 上位</b>（勝点×2着モデル×3着モデル）</div><ol>'
          + r['3連単上位'].slice(0, 6).map((x, i) => '<li'+(x.組 === act ? ' class="hit"' : '')+'>'+(i+1)+'. <b>'+esc(x.組)+'</b><small>'+x.確率.toFixed(1)+'%</small></li>').join('') + '</ol>';
        sec.appendChild(tb);
      }
      const t = document.createElement('table');
      t.innerHTML = '<colgroup><col style="width:28px"><col><col style="width:44px"><col style="width:44px"><col style="width:32px"><col style="width:32px"><col style="width:36px"><col style="width:30px"><col style="width:32px">'+(r.確定?'<col style="width:26px">':'')+'</colgroup>'
        + '<tr><th>車</th><th class="horse">選手 <small>級班 府県 脚質 期別 年齢 / 得点=競走得点 決まり手 B / 直近30走の勝率·3着内率</small></th><th>得点</th><th>市場<br><small>人気·1着率</small></th><th>勝点</th><th>複点<br><small>3着内</small></th><th>着率<br><small>2着/3着</small></th><th>差</th><th>判定</th>'+(r.確定?'<th>着</th>':'')+'</tr>';
      rows.forEach(h => {
        const tr = document.createElement('tr');
        if (top && h.馬番 === top.馬番) tr.className = 'top';
        const cls = h.判定 === '割安' ? 'cheap' : (h.判定 === '割高' ? 'dear' : '');
        const rk = rankNum(h.着順);
        const sub = [h.級班, h.府県, h.脚質, h.期別 ? h.期別+'期' : '', h.年齢 ? h.年齢+'歳' : '', h.補充 ? '('+h.補充+')' : '', h.決まり手, 'B'+h.B, (h.直近勝率!=='' ? '直近 勝'+h.直近勝率+'% 3着内'+h.直近3着内+'%' : '')].filter(x => x).join(' ');
        const ln = h.ライン ? (h.ライン長 > 1 ? (h.位置 === 1 ? '先頭' : h.位置 + '番手') + '/' + h.ライン長 + '車' : '単騎') : '';
        const cm = [h.予想印 ? '記者' + h.予想印 : '', ln, h.コメント].filter(x => x).join(' ');
        const ex = r.確定 ? esc((h.結果決まり手||'')+(h.上り?' 上り'+h.上り:'')) : '';
        tr.innerHTML = '<td class="waku w'+h.馬番+'"><span>'+h.馬番+'</span></td>'
          + '<td class="horse">'+(h.印?'<span class="mark">'+h.印+'</span>':'')+'<span class="nm">'+esc(h.馬名)+'</span><span class="sub">'+esc(sub)+'</span>'+(cm?'<span class="sub cm">'+esc(cm)+'</span>':'')+'</td>'
          + '<td class="ex">'+(h.競走得点||'-')+(ex?'<small>'+ex+'</small>':'')+'</td>'
          + '<td class="odds'+(h.人気>=1&&h.人気<=3?' n'+h.人気:'')+'">'+(h.人気?h.人気+'人':'-')+'<small>'+(h.市場勝点!==null?fmt(h.市場勝点,0)+'%':'')+'</small></td>'
          + '<td class="pt"><b>'+fmt(h.勝点,0)+'</b></td>'
          + '<td>'+fmt(h.複点,0)+'</td>'
          + '<td class="pl">'+(h.着率 ? '<small>'+fmt(h.着率[1],0)+'</small><small class="p3">'+fmt(h.着率[2],0)+'</small>' : '-')+'</td>'
          + '<td class="'+cls+'">'+(h.評価差===null?'-':(h.評価差>0?'+':'')+fmt(h.評価差,0))+'</td>'
          + '<td class="'+cls+'">'+esc(h.判定)+'</td>'
          + (r.確定?'<td class="res'+(rk<=3?' r'+rk:'')+'">'+esc(h.着順)+'</td>':'');
        t.appendChild(tr);
      });
      sec.appendChild(t);
    }
    main.appendChild(sec);
  });
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = '勝点・複点＝モデルの「1着になる確率」「3着以内に入る確率」(%)。市場＝2車単オッズから逆算した「市場が見る1着確率」（競輪に単勝は無いため）。差＝勝点−市場（+5以上 割安 / −5以下 割高）。並び（ライン）は当日朝に公式の並び予想が出ればそれ（公式）、無ければ府県・脚質・得点からの推定（推定）です。'
    + '買い目の「的中率重視」は勝点1位から同じラインの次点へ（当たる回数は増えるが配当も下がる）、「回収率重視」は市場1〜3番人気の3人が全部同じラインのときだけワイド 1番人気＋3番人気を買い、それ以外は見送り（買うのはレースの3%ほど）。'
    + '着率（2着/3着）と「3連単の確率 上位」は、勝点に「1着の選手が決まったときの2着の確率」「1・2着が決まったときの3着の確率」（ラインや府県の関係を見る別のモデル）を掛けたものです。的中率重視の3連単は 勝点1位→2着の確率1位→3着の確率1位 の1点です。'
    + '過去5年の検証では 2車単・ワイドの回収率は75〜77%、3連単（的中率重視）は約79%、回収率重視は約84%で、どの買い方も100%には届いていません。参考情報としてご利用ください。';
  main.appendChild(n);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { sort = b.dataset.s; try { localStorage.setItem('sort', sort); } catch(e) {} render(); });
render();
setInterval(render, 60000);
</script>
