const D = JSON.parse(document.getElementById('data').textContent);

const dtabs = document.getElementById('dtabs'), vtabs = document.getElementById('vtabs'), rtabs = document.getElementById('rtabs'), main = document.getElementById('main');
let curV = null, sort = 'pt';
try { curV = localStorage.getItem('venue'); sort = localStorage.getItem('sort') || 'pt'; } catch(e) {}
// 最初に開く日 = 端末の今日（データにあれば）。無ければ生成時の「今日」
let curDay = D.days.some(x => x.date === todayYMD()) ? todayYMD() : D.today;
const openState = {};   // 'date+venue+rno' -> 開いているか（ユーザーが触ったものだけ記録）
function opened(key, dflt){ return (key in openState) ? openState[key] : dflt; }
function fmt(v, d){ return (v === null || v === undefined) ? '-' : (d === 0 ? String(Math.round(v)) : v.toFixed(d)); }
function hhmm(t){ return t && t.length === 4 ? t.slice(0,2)+':'+t.slice(2) : (t||''); }
function todayYMD(){ const n = new Date(); return n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0'); }
function nowHHMM(){ const n = new Date(); return String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// そのレースがまだ投票できるか（日付が今日より前なら終了、後なら未発走）。発走＝締切予定時刻
function isOpen(day, r){
  if (r.確定) return false;
  const t = todayYMD();
  if (day.date < t) return false;
  if (day.date > t) return true;
  return !(r.発走 && r.発走 <= nowHHMM());
}
function rankNum(s){ const n = parseInt(s, 10); return isNaN(n) ? 999 : n; }
// 買い目 2 種類（32 が kaime.py で作る）。確定したレースは 的中（払戻）/ 外れ を付ける
function buyLine(r){

  const res = e => (e.払戻 === undefined) ? '' : (e.払戻 > 0 ? ' <span class="ok">的中 '+Math.round(e.払戻).toLocaleString()+'円</span>' : ' <span class="ng">外れ</span>');
  const g = id => k.find(e => e.方式 === id) || {};

  return '<div class="info buy">'+s+'</div>';
}

        const cm = [h.予想印 ? '記者' + h.予想印 : '', ln, h.コメント].filter(x => x).join(' ');
        const ex = r.確定 ? esc((h.結果決まり手||'')+(h.上り?' 上り'+h.上り:'')) : '';
        tr.innerHTML = '<td class="waku w'+h.馬番+'"><span>'+h.馬番+'</span></td>'
          + '<td class="horse">'+(h.印?'<span class="mark">'+h.印+'</span>':'')+'<span class="nm">'+esc(h.馬名)+'</span><span class="sub">'+esc(sub)+'</span>'+(cm?'<span class="sub cm">'+esc(cm)+'</span>':'')+'</td>'
          + '<td class="ex">'+(h.競走得点||'-')+(ex?'<small>'+ex+'</small>':'')+'</td>'
          + '<td class="odds'+(h.人気>=1&&h.人気<=3?' n'+h.人気:'')+'">'+(h.人気?h.人気+'人':'-')+'<small>'+(h.市場勝点!==null?fmt(h.市場勝点,0)+'%':'')+'</small></td>'
          + '<td class="pt"><b>'+fmt(h.勝点,0)+'</b></td>'
          + '<td>'+fmt(h.複点,0)+'</td>'
          + '<td class="pl">'+(h.着率 ? '<small>'+fmt(h.着率[1],0)+'</small><small class="p3">'+fmt(h.着率[2],0)+'</small>' : '-')+'</td>'
          + '<td class="'+cls+'">'+(h.評価差===null?'-':(h.評価差>0?'+':'')+fmt(h.評価差,0))+'</td>'
          + '<td class="'+cls+'">'+esc(h.判定)+'</td>'
          + (r.確定?'<td class="res'+(rk<=3?' r'+rk:'')+'">'+esc(h.着順)+'</td>':'');
        t.appendChild(tr);
      });
      sec.appendChild(t);
    }
    main.appendChild(sec);
  });
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = '勝点・複点＝モデルの「1着になる確率」「3着以内に入る確率」(%)。市場＝2車単オッズから逆算した「市場が見る1着確率」（競輪に単勝は無いため）。差＝勝点−市場（+5以上 割安 / −5以下 割高）。並び（ライン）は当日朝に公式の並び予想が出ればそれ（公式）、無ければ府県・脚質・得点からの推定（推定）です。'
    + '買い目の「的中率重視」は勝点1位から同じラインの次点へ（当たる回数は増えるが配当も下がる）、「回収率重視」は市場1〜3番人気の3人が全部同じラインのときだけワイド 1番人気＋3番人気を買い、それ以外は見送り（買うのはレースの3%ほど）。'
    + '着率（2着/3着）と「3連単の確率 上位」は、勝点に「1着の選手が決まったときの2着の確率」「1・2着が決まったときの3着の確率」（ラインや府県の関係を見る別のモデル）を掛けたものです。的中率重視の3連単は 勝点1位→2着の確率1位→3着の確率1位 の1点です。'
    + '過去5年の検証では 2車単・ワイドの回収率は75〜77%、3連単（的中率重視）は約79%、回収率重視は約84%で、どの買い方も100%には届いていません。参考情報としてご利用ください。';
  main.appendChild(n);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { sort = b.dataset.s; try { localStorage.setItem('sort', sort); } catch(e) {} render(); });
render();
setInterval(render, 60000);
</script>
