  const now = nowHHMM();
  let opened = false;
  v.races.forEach(r => {
    const det = document.createElement('details');
    det.className = 'race' + (r.確定 ? ' done' : '');
    const top = r.馬[0];
    const pick = top ? (top.印 ? top.印 + ' ' : '') + top.馬番 + ' ' + top.馬名 + '（複' + fmt(top.複点,0) + '）' : '';
    const status = r.確定 ? '確定' : (r.発走 && r.発走 <= now ? '発走済' : '');
    det.innerHTML = '<summary><span class="rno">'+r.rno+'R</span><span class="time">'+hhmm(r.発走)+'</span>'
      + '<span class="rname">'+esc(r.レース名)+(status?'<span class="st">'+status+'</span>':'')+'<span class="cond">'+esc(r.芝ダ)+r.距離+'m '+esc(r.回り)+' '+r.頭数+'頭 '+esc(r.馬場)+'</span></span>'
      + '<span class="pick">'+esc(pick)+'</span></summary>';
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>馬番</th><th style="text-align:left">馬名 / 騎手</th><th>脚</th><th>単オ</th><th>勝点</th><th>複点</th><th>市場</th><th>差</th><th>判定</th>'+(r.確定?'<th>着</th>':'')+'</tr>';
    r.馬.forEach((h, i) => {
      const tr = document.createElement('tr');
      if (i === 0) tr.className = 'top';
      const cls = h.判定 === '割安' ? 'cheap' : (h.判定 === '割高' ? 'dear' : '');
      tr.innerHTML = '<td><span class="ban w'+(h.枠番||0)+'">'+h.馬番+'</span></td>'
        + '<td class="l name">'+(h.印?'<span class="mark">'+h.印+'</span> ':'')+esc(h.馬名)+'<br><span class="jk">'+esc(h.騎手)+(h.人気?' '+h.人気+'人気':'')+'</span></td>'
        + '<td>'+esc(h.脚質)+'</td>'
        + '<td>'+fmt(h.単勝オッズ,1)+'</td>'
        + '<td><b>'+fmt(h.勝点,0)+'</b></td>'
        + '<td>'+fmt(h.複点,0)+'</td>'
        + '<td>'+fmt(h.市場勝点,0)+'</td>'
        + '<td class="'+cls+'">'+(h.評価差===null?'-':(h.評価差>0?'+':'')+fmt(h.評価差,0))+'</td>'
        + '<td class="'+cls+'">'+esc(h.判定)+'</td>'
        + (r.確定?'<td class="res">'+esc(h.着順)+'</td>':'');
      t.appendChild(tr);
    });
    det.appendChild(t);
    if (!opened && !r.確定 && !(r.発走 && r.発走 <= now)) { det.open = true; opened = true; }
    main.appendChild(det);
  });
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = '点数は「勝つ確率」「3着以内に来る確率」（%）。市場は単勝オッズから逆算した市場の勝つ確率。11年の検証ではどの買い方も回収率100%に届いていません（複勝90点以上で96%）。参考情報としてご利用ください。';
  main.appendChild(n);
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
render();
</script>
</body>
</html>
