<script>
const D = JSON.parse(document.getElementById('data').textContent);
document.getElementById('u').textContent = D.updated.slice(5);
const dtabs = document.getElementById('dtabs'), vtabs = document.getElementById('vtabs'), rtabs = document.getElementById('rtabs'), main = document.getElementById('main');
let curV = null, sort = 'pt';
try { curV = localStorage.getItem('venue'); sort = localStorage.getItem('sort') || 'pt'; } catch(e) {}
// 最初に開く日 = 端末の今日（データにあれば）。無ければ生成時の「今日」
let curDay = D.days.some(x => x.date === todayYMD()) ? todayYMD() : D.today;
const openState = {};   // 'date+venue+rno' -> 開いているか（ユーザーが触ったものだけ記録）
function opened(key, dflt){ return (key in openState) ? openState[key] : dflt; }
function fmt(v, d){ return (v === null || v === undefined) ? '-' : (d === 0 ? String(Math.round(v)) : v.toFixed(d)); }
function hhmm(t){ return t && t.length === 4 ? t.slice(0,2)+':'+t.slice(2) : (t||''); }
function todayYMD(){ const n = new Date(); return n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0'); }
function nowHHMM(){ const n = new Date(); return String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// そのレースがまだ投票できるか（日付が今日より前なら終了、後なら未発走）
function isOpen(day, r){
  if (r.確定) return false;
  const t = todayYMD();
  if (day.date < t) return false;
  if (day.date > t) return true;
  return !(r.発走 && r.発走 <= nowHHMM());
}
function rankNum(s){ const n = parseInt(s, 10); return isNaN(n) ? 999 : n; }
function render(){
  const day = D.days.find(x => x.date === curDay) || D.days[1];
  // 日付タブ
  dtabs.innerHTML = '';
  D.days.forEach(x => {
    const b = document.createElement('button');
    b.innerHTML = esc(x.label) + '<b>' + esc(x.disp) + '</b>';
    if (x === day) b.className = 'on';
    b.onclick = () => { curDay = x.date; render(); };
    dtabs.appendChild(b);
  });
  // 競馬場タブ
  vtabs.innerHTML = ''; rtabs.innerHTML = ''; main.innerHTML = '';
  if (!day.venues.length) { main.innerHTML = '<div class="empty">この日は対象のレースがありません</div>'; return; }
  let v = day.venues.find(x => x.name === curV) || day.venues[0];
  day.venues.forEach(x => {
    const b = document.createElement('button');
    const nx = x.races.find(r => isOpen(day, r));
    b.innerHTML = '<b>'+esc(x.name)+'</b>' + (nx ? '次 '+nx.rno+'R '+hhmm(nx.発走) : '終了');
    if (x === v) b.className = 'on';
    b.onclick = () => { curV = x.name; try { localStorage.setItem('venue', curV); } catch(e) {} render(); };
    vtabs.appendChild(b);
  });
  document.querySelectorAll('.seg button').forEach(b => b.className = b.dataset.s === sort ? 'on' : '');
  // レース番号タブ
  const nextR = v.races.find(r => isOpen(day, r));
  v.races.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r.rno + 'R';
    b.className = !isOpen(day, r) ? 'past' : (r === nextR ? 'now' : '');
    b.onclick = () => {
      openState[day.date + v.name + r.rno] = true; render();
      const el = document.getElementById('r' + r.rno);
      if (el) { const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.topbar').offsetHeight; window.scrollTo({top: y, behavior: 'smooth'}); }
    };
    rtabs.appendChild(b);
  });
  // レース本体
  v.races.forEach(r => {
    const sec = document.createElement('section');
    sec.className = 'race'; sec.id = 'r' + r.rno;
    const top = r.馬[0];
    const open = isOpen(day, r);
    const status = r.確定 ? '確定' : (open ? (day.date > todayYMD() ? '前日' : '発売中') : '発走済');
    const winner = r.確定 ? r.馬.find(h => h.着順 === '1') : null;
    const pick = r.確定 && winner
      ? '1着 ' + winner.馬番 + ' ' + esc(winner.馬名) + '<br>' + (top ? '予想1位 ' + top.馬番 + '→' + (top.着順 || '-') + '着' : '')
      : (top ? (top.印 ? '<b>'+top.印+'</b> ' : '') + top.馬番 + ' ' + esc(top.馬名) + '<br>複' + fmt(top.複点,0) + '点' : '');
    const key = day.date + v.name + r.rno;
    const isOpened = opened(key, r === nextR);
    sec.innerHTML = '<div class="rh"><span class="no">'+r.rno+'R</span><span class="ttl"><span class="name">'+esc(r.レース名)+'</span><span class="st'+(open?' open':'')+'">'+status+'</span>'
      + '<div class="info">'+hhmm(r.発走)+'発走 ／ '+esc(r.芝ダ)+r.距離+'m（'+esc(r.回り)+'）／ '+r.頭数+'頭'+(r.天候?' ／ 天候:'+esc(r.天候):'')+(r.馬場?' 馬場水分:'+esc(r.馬場)+'%':'')+'</div></span>'
      + '<span class="pick">'+pick+'</span><span class="tri">'+(isOpened?'▲':'▼')+'</span></div>';
    sec.querySelector('.rh').onclick = () => { openState[key] = !isOpened; render(); };
    if (isOpened) {
      const rows = r.馬.slice();
      if (sort === 'no') rows.sort((a,b) => a.馬番 - b.馬番);
      else if (sort === 'res' && r.確定) rows.sort((a,b) => rankNum(a.着順) - rankNum(b.着順));
      else if (sort === 'gap') rows.sort((a,b) => (b.評価差 ?? -999) - (a.評価差 ?? -999));
      const t = document.createElement('table');
      t.innerHTML = '<colgroup><col style="width:24px"><col style="width:24px"><col><col style="width:20px"><col style="width:46px"><col style="width:32px"><col style="width:32px"><col style="width:34px"><col style="width:34px">'+(r.確定?'<col style="width:24px">':'')+'</colgroup>'
        + '<tr><th>枠</th><th>番</th><th style="text-align:left">馬名 / 父・性齢・そり重量・騎手・馬体重</th><th>単勝<br><small>人気·市場</small></th><th>勝点</th><th>複点</th><th>差</th><th>判定</th>'+(r.確定?'<th>着</th>':'')+'</tr>';
      rows.forEach(h => {
        const tr = document.createElement('tr');
        if (top && h.馬番 === top.馬番) tr.className = 'top';
        const cls = h.判定 === '割安' ? 'cheap' : (h.判定 === '割高' ? 'dear' : '');
        const rk = rankNum(h.着順);
        tr.innerHTML = '<td class="waku w'+(h.枠番||0)+'"><span>'+(h.枠番||'')+'</span></td>'
          + '<td class="ban">'+h.馬番+'</td>'
          + '<td class="horse">'+(h.印?'<span class="mark">'+h.印+'</span>':'')+'<span class="nm">'+esc(h.馬名)+'</span><span class="sub">'+esc(h.父)+' ／ '+esc(h.性齢)+' '+esc(h.斤量)+' '+esc(h.騎手)+(h.馬体重?' '+esc(h.馬体重):'')+'</span></td>'
                    + '<td class="odds'+(h.人気>=1&&h.人気<=3?' n'+h.人気:'')+'">'+fmt(h.単勝オッズ,1)+'<small>'+(h.人気?h.人気+'人':'')+(h.市場勝点!==null?'·市'+fmt(h.市場勝点,0):'')+'</small></td>'
          + '<td class="pt"><b>'+fmt(h.勝点,0)+'</b></td>'
          + '<td>'+fmt(h.複点,0)+'</td>'
          + '<td class="'+cls+'">'+(h.評価差===null?'-':(h.評価差>0?'+':'')+fmt(h.評価差,0))+'</td>'
          + '<td class="'+cls+'">'+esc(h.判定)+'</td>'
          + (r.確定?'<td class="res'+(rk<=3?' r'+rk:'')+'">'+esc(h.着順)+'</td>':'');
        t.appendChild(tr);
      });
      sec.appendChild(t);
    }
    main.appendChild(sec);
  });
  const n = document.createElement('div');
  n.className = 'note';
  n.textContent = '勝点・複点＝モデルの「勝つ確率」「3着以内に来る確率」(%)。市場＝単勝オッズから逆算した勝つ確率。差＝勝点−市場（+5以上 割安 / −5以下 割高）。翌日はオッズが出るまで市場・差は「-」。ばんえいは 2020〜2026 の 6.7 年ぶんで学習（オッズは 2026年3月〜のみ）。回収率の検証はまだ短いので、参考情報としてご利用ください。';
  main.appendChild(n);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { sort = b.dataset.s; try { localStorage.setItem('sort', sort); } catch(e) {} render(); });
render();
setInterval(render, 60000);
</script>
</body>
</html>
